<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koraal &middot; Via Jeugd</title>
<style>
  :root{
    --bg:#F7F5F0;            /* Koraal gebroken-wit */
    --blauw:#004080;         /* Koraalblauw */
    --cyaan:#0090D0;         /* cyaan accent */
    --titel:#2E8FD0;         /* lichter blauw voor de titel */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"Calibri","Inter","Segoe UI",system-ui,sans-serif}

  .stage{position:fixed;inset:0}
  .stage.off{display:none}
  .stage canvas{position:fixed;inset:0;display:block}

  /* titel */
  .caption{
    position:fixed;left:0;right:0;bottom:6vh;text-align:center;
    pointer-events:none;user-select:none;color:var(--titel);
    transition:opacity 1.2s ease;padding:0 4vw;z-index:5;
  }
  .caption .merk{
    font-size:clamp(22px,3vw,48px);letter-spacing:.34em;
    text-transform:uppercase;font-weight:700;opacity:1;text-indent:.34em;
    text-shadow:0 1px 0 rgba(247,245,240,.95),0 0 22px rgba(247,245,240,.85),0 0 44px rgba(247,245,240,.65);
  }
  .caption .merk::after{
    content:"";display:block;width:clamp(80px,9vw,150px);height:3px;
    margin:.55em auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--blauw),var(--cyaan));
    opacity:.85;box-shadow:0 0 12px rgba(247,245,240,.8);
  }
  .caption .sub{
    margin-top:.85em;font-size:clamp(12px,1.25vw,18px);
    letter-spacing:.28em;text-transform:uppercase;opacity:.72;
    text-indent:.28em;font-weight:600;
    text-shadow:0 0 16px rgba(247,245,240,.9),0 1px 0 rgba(247,245,240,.9);
  }
  .caption.hidden{opacity:0}

  /* schakelaar */
  #switch{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;padding:5px;border-radius:999px;z-index:20;
    background:rgba(247,245,240,.72);backdrop-filter:blur(8px);
    box-shadow:0 4px 22px rgba(0,64,128,.12),inset 0 0 0 1px rgba(0,64,128,.10);
    max-width:96vw;transition:opacity .4s ease;
  }
  /* in volledig scherm: balk + cursor verbergen na rust, terug bij muisbeweging */
  body.fs-idle{cursor:none}
  body.fs-idle #switch{opacity:0;pointer-events:none}
  body.fs-idle .pres__bar{opacity:0 !important}
  :fullscreen .pres__bar{opacity:1}
  #switch button{
    appearance:none;border:0;cursor:pointer;background:transparent;
    color:var(--blauw);font-family:inherit;font-weight:600;
    padding:9px 18px 9px 14px;border-radius:999px;display:flex;align-items:center;gap:9px;
    font-size:13px;letter-spacing:.10em;text-transform:uppercase;white-space:nowrap;
    transition:background .35s ease,color .35s ease,box-shadow .35s ease;
  }
  #switch button b{
    display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
    font-size:13px;font-weight:700;
    background:rgba(0,64,128,.10);color:var(--blauw);transition:inherit;
  }
  #switch button:hover{background:rgba(0,64,128,.06)}
  #switch button.active{
    background:linear-gradient(90deg,var(--blauw),var(--cyaan));color:#fff;
    box-shadow:0 2px 12px rgba(0,64,128,.30);
  }
  #switch button.active b{background:rgba(255,255,255,.28);color:#fff}
  @media (max-width:720px){
    #switch button span{display:none}
    #switch button{padding:9px 12px}
  }

  /* presentatie-slideshow (knop 3 & 4) */
  .stage--pres{background:var(--bg)}
  .pres__img{
    position:fixed;inset:0;width:100%;height:100%;object-fit:contain;
    background:var(--bg);opacity:0;transition:opacity .55s ease;
  }
  .pres__img.is-on{opacity:1}
  .pres__nav{
    position:fixed;top:0;bottom:0;width:16%;min-width:64px;z-index:12;cursor:pointer;
    border:0;background:transparent;display:flex;align-items:center;color:var(--blauw);
    opacity:0;transition:opacity .3s ease;
  }
  .stage--pres:hover .pres__nav{opacity:.45}
  .pres__nav:hover{opacity:1;background:linear-gradient(var(--dir),rgba(0,64,128,.07),transparent)}
  .pres__nav--prev{left:0;justify-content:flex-start;padding-left:20px;--dir:90deg}
  .pres__nav--next{right:0;justify-content:flex-end;padding-right:20px;--dir:270deg}
  .pres__nav svg{width:38px;height:38px;filter:drop-shadow(0 1px 2px rgba(247,245,240,.9))}
  .pres__bar{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:14;
    display:flex;align-items:center;gap:13px;padding:8px 16px;border-radius:999px;
    background:rgba(247,245,240,.82);backdrop-filter:blur(8px);color:var(--blauw);
    box-shadow:0 4px 22px rgba(0,64,128,.12),inset 0 0 0 1px rgba(0,64,128,.10);
    font-size:13px;font-weight:600;opacity:.25;transition:opacity .35s ease;user-select:none;
  }
  .stage--pres:hover .pres__bar,.pres__bar:hover,.pres__bar:focus-within{opacity:1}
  .pres__bar button{appearance:none;border:0;background:transparent;color:var(--blauw);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .pres__count{letter-spacing:.08em;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
  .pres__range{width:110px;accent-color:var(--blauw)}
  .pres__speedval{min-width:30px;text-align:right;opacity:.7;font-weight:500}

  /* hint */
  #hint{
    position:fixed;bottom:18px;right:24px;color:var(--blauw);z-index:20;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    opacity:.34;pointer-events:none;transition:opacity 1.2s ease;text-align:right;
  }
  #hint.gone{opacity:0}
</style>
</head>
<body>
  <div id="stage1" class="stage off"></div>
  <div id="stage2" class="stage off"></div>
  <div id="stage3" class="stage stage--pres off"></div>
  <div id="stage4" class="stage stage--pres off"></div>

  <nav id="switch" aria-label="Weergave kiezen">
    <button data-v="1"><b>1</b><span>Samenvloeiing</span></button>
    <button data-v="2"><b>2</b><span>Koraaltuin</span></button>
    <button data-v="3"><b>3</b><span>Foto&rsquo;s</span></button>
    <button data-v="4"><b>4</b><span>Vragen</span></button>
  </nav>

  <div id="hint"></div>

<script src="/assets/home.js?v=3"></script>
<script src="/assets/js/version.js?v=1" defer></script>
</body>
</html>

name = "koraalenviajeugd"
main = "src/index.ts"
compatibility_date = "2026-06-12"
workers_dev = false

# Custom domains (koraalenviajeugd.nl + www) zijn via Cloudflare API
# rechtstreeks aan de Worker gekoppeld. Niet in deze toml om te
# voorkomen dat elke deploy een zone-level token-permissie vereist.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[[d1_databases]]
binding = "OCAI_DB"
database_name = "ocai"
database_id = "4877440a-449f-4e87-a04e-a1c0b7c5ca02"

# Rate-limit /api/opslaan: 30 POSTs per 60s per Cloudflare-edge-IP.
# Ruim genoeg voor een bijeenkomst van 100 medewerkers achter één NAT,
# strak genoeg om script-spam af te knijpen.
[[unsafe.bindings]]
name = "OPSLAAN_RL"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 30, period = 60 }
